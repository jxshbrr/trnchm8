<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrenchM8 - landing v2, B3 (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; min-height: 8000px; background: {{bg}}">
  <dc-import name="LandingB3" layout="mobile" theme="{{theme}}" accent="{{accent}}" hint-size="390px,8000px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Look"},"accent":{"editor":"color","default":"#7CD4FF","options":["#7CD4FF","#FFD23F","#6495ED","#B4A5FF","#FF85C8","#FF9152","#FFB547"],"section":"Look"},"$preview":{"width":390,"height":8000}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    return { theme, accent: this.props.accent ?? '#7CD4FF', bg: theme === 'light' ? '#F4F4F7' : '#0D0E13' };
  }
}
</script>
</body>
</html>
