<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrenchM8 - clickable prototype (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
/* TrenchM8 motion: 120-150ms press/hover, 250-350ms UI, 600-900ms load-in. Ease-out. Fades only when reduced motion is on. */
@keyframes tm-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tm-fade{from{opacity:0}to{opacity:1}}
@keyframes tm-draw{to{stroke-dashoffset:0}}
@keyframes tm-shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes tm-dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes tm-toast{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes tm-pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes tm-spin{to{transform:rotate(360deg)}}
@keyframes tm-pulse{0%{box-shadow:0 0 0 0 var(--tm-pulse,rgba(63,217,142,.45))}100%{box-shadow:0 0 0 10px rgba(0,0,0,0)}}
@keyframes tm-fill{from{width:0}to{width:100%}}
@keyframes tm-out{from{opacity:1}to{opacity:0}}
@keyframes tm-flash{0%{background-color:var(--tm-flash,rgba(124,212,255,.22))}100%{background-color:transparent}}
.tm-press{transition:transform .12s ease,filter .15s ease,background-color .15s ease,opacity .15s ease}
.tm-press:hover{filter:brightness(1.12)}
.tm-press:active{transform:scale(.97)}
.tm-press:focus-visible,.tm-hover:focus-visible{outline:2px solid var(--tm-focus,#7CD4FF);outline-offset:2px}
.tm-hover{transition:filter .15s ease,transform .15s ease}
.tm-hover:hover{filter:brightness(1.18)}
.tm-in{animation:tm-in .35s cubic-bezier(.2,.8,.2,1) both}
.tm-fade{animation:tm-fade .6s ease both;animation-delay:var(--tm-d,0s)}
.tm-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:tm-draw .9s cubic-bezier(.2,.8,.2,1) calc(var(--tm-d,0s) + .15s) forwards}
.tm-skel{background:linear-gradient(90deg,var(--sk1) 0%,var(--sk2) 50%,var(--sk1) 100%);background-size:800px 100%;animation:tm-shimmer 1.2s linear infinite}
.tm-dot{display:inline-block;width:6px;height:6px;border-radius:3px;background:currentColor;animation:tm-dot 1.2s ease-in-out infinite}
.tm-toast{animation:tm-toast .25s cubic-bezier(.2,.8,.2,1) both}
.tm-pop{animation:tm-pop .45s cubic-bezier(.2,.8,.2,1) both}
.tm-spin{animation:tm-spin .8s linear infinite}
.tm-pulse{animation:tm-pulse 1.6s ease-out infinite}
.tm-flash{animation:tm-flash 1.6s ease-out both}
.tm-out{animation:tm-out .22s ease both;pointer-events:none}
@media (prefers-reduced-motion:reduce){.tm-in,.tm-toast,.tm-pop{animation:tm-fade .2s ease both}.tm-draw{animation:none;stroke-dasharray:none;stroke-dashoffset:0}.tm-skel,.tm-dot,.tm-pulse,.tm-spin{animation:none}.tm-press:active{transform:none}}
/* Tooltips: data-tip="text" (+ data-tip-pos="bottom|left|right", data-tip-wrap for long text). Desktop hover/keyboard only. */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);padding:6px 10px;border-radius:10px;background:var(--tm-tip-bg,#F3F4F7);color:var(--tm-tip-fg,#12131A);font:600 12px/1.35 Manrope,system-ui,sans-serif;letter-spacing:0;text-transform:none;text-align:left;white-space:nowrap;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .12s ease,transform .12s ease,visibility 0s linear .12s;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.28)}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .12s ease .35s,transform .12s ease .35s,visibility 0s linear .35s}
[data-tip-pos=bottom]::after{bottom:auto;top:calc(100% + 8px);transform:translate(-50%,-4px)}
[data-tip-pos=left]::after{left:auto;right:calc(100% + 8px);bottom:50%;transform:translate(4px,50%)}
[data-tip-pos=left]:hover::after,[data-tip-pos=left]:focus-visible::after{transform:translate(0,50%)}
[data-tip-pos=right]::after{left:calc(100% + 8px);bottom:50%;transform:translate(-4px,50%)}
[data-tip-pos=right]:hover::after,[data-tip-pos=right]:focus-visible::after{transform:translate(0,50%)}
[data-tip-wrap]::after{white-space:normal;width:max-content;max-width:240px}
@media (hover:none){[data-tip]::after{display:none}}
[data-tip=""]::after{display:none}
/* Clickable rows (no inline background on the row itself) and clickable cards */
.tm-row{transition:background-color .15s ease;cursor:pointer}
.tm-row:hover{background-color:var(--tm-row-hover,rgba(255,255,255,.045))}
.tm-row:active{background-color:var(--tm-row-press,rgba(255,255,255,.08))}
.tm-lift{transition:filter .15s ease,box-shadow .15s ease;cursor:pointer}
.tm-lift:hover{filter:brightness(1.07)}
.tm-press[aria-disabled=true],.tm-press:disabled{opacity:.45;cursor:not-allowed;filter:none}
.tm-press[aria-disabled=true]:active,.tm-press:disabled:active{transform:none}
@keyframes tm-shake{0%,100%{transform:none}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.tm-shake{animation:tm-shake .3s ease}
@keyframes tm-sheet{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes tm-dialog{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes tm-drawer{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
.tm-sheet{animation:tm-sheet .3s cubic-bezier(.2,.8,.2,1) both}
.tm-dialog{animation:tm-dialog .22s cubic-bezier(.2,.8,.2,1) both}
.tm-drawer{animation:tm-drawer .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes tm-wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.tm-wave{animation:tm-wave .9s ease-in-out infinite;transform-origin:center}
@media (prefers-reduced-motion:reduce){.tm-sheet,.tm-dialog,.tm-drawer{animation:tm-fade .2s ease both}.tm-shake,.tm-wave{animation:none}}
</style>
</helmet>
<div style="--tm-focus: {{tkn.ink}}; --tm-flash: {{tkn.flash}}; position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: {{c.bg}}; font-family: Manrope, system-ui, sans-serif">

  <!-- Tab screens: each scrolls on its own and resets to the top when you switch -->
  <sc-if value="{{onJournal}}" hint-placeholder-val="{{ true }}">
    <div style="flex-grow: 1; min-height: 0; overflow-y: auto">
      <div class="tm-in" style="--tm-d: {{introD}}; animation-delay: {{introD}}"><dc-import name="Main" day="{{day}}" on-day="{{setDay}}" on-share="{{openShare}}" hide-nav="{{ true }}" on-nav="{{go}}" on-toast="{{showToast}}" intro-delay="{{introMs}}" accent="{{accent}}" theme="{{theme}}" voice="{{voice}}" on-modal="{{openModal}}" hint-size="390px,2620px"></dc-import></div>
    </div>
  </sc-if>
  <sc-if value="{{onStats}}" hint-placeholder-val="{{ false }}">
    <div style="flex-grow: 1; min-height: 0; overflow-y: auto">
      <div class="tm-in" style="--tm-d: {{introD}}; animation-delay: {{introD}}"><dc-import name="Stats" layout="mobile" hide-nav="{{ true }}" on-nav="{{go}}" on-toast="{{showToast}}" accent="{{accent}}" theme="{{theme}}" on-modal="{{openModal}}" hint-size="390px,5300px"></dc-import></div>
    </div>
  </sc-if>
  <sc-if value="{{onSettings}}" hint-placeholder-val="{{ false }}">
    <div style="flex-grow: 1; min-height: 0; overflow-y: auto">
      <div class="tm-in" style="--tm-d: {{introD}}; animation-delay: {{introD}}"><dc-import name="Settings" layout="mobile" hide-nav="{{ true }}" on-nav="{{go}}" on-toast="{{showToast}}" accent="{{accent}}" theme="{{theme}}" voice="{{voice}}" on-accent="{{setAccent}}" on-theme="{{setTheme}}" on-voice="{{setVoice}}" on-modal="{{openModal}}" hint-size="390px,4300px"></dc-import></div>
    </div>
  </sc-if>

  <!-- First-visit skeleton over the page area -->
  <sc-if value="{{skel}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 96px; z-index: 5; overflow: hidden; background: {{c.bg}}; animation: {{skelAnim}}">
      <dc-import name="Skeleton" layout="mobile" page="{{tab}}" theme="{{theme}}" hint-size="390px,748px"></dc-import>
    </div>
  </sc-if>

  <!-- Tab bar (hidden while M8 is open full screen) -->
  <sc-if value="{{showTabs}}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Main" style="flex-shrink: 0; margin: 8px 16px 20px 16px; padding: 6px; border-radius: 999px; background: {{c.surface}}; box-shadow: 0 -12px 24px {{c.bg}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
      <a class="tm-press" href="#journal" aria-current="{{t.journal.current}}" onClick="{{t.journal.go}}" style="height: 56px; border-radius: 999px; background: {{t.journal.bg}}; color: {{t.journal.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: {{t.journal.weight}}; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>
        Journal
      </a>
      <a class="tm-press" href="#stats" aria-current="{{t.stats.current}}" onClick="{{t.stats.go}}" style="height: 56px; border-radius: 999px; background: {{t.stats.bg}}; color: {{t.stats.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: {{t.stats.weight}}; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10"></path><path d="M12 20V4"></path><path d="M19 20v-7"></path></svg>
        Stats
      </a>
      <a class="tm-press" href="#m8" aria-current="{{t.m8.current}}" onClick="{{t.m8.go}}" style="height: 56px; border-radius: 999px; background: {{t.m8.bg}}; color: {{t.m8.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: {{t.m8.weight}}; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="6"></rect><path d="M9.5 9.5v4"></path><path d="M14.5 9.5v4"></path></svg>
        M8
      </a>
      <a class="tm-press" href="#settings" aria-current="{{t.settings.current}}" onClick="{{t.settings.go}}" style="height: 56px; border-radius: 999px; background: {{t.settings.bg}}; color: {{t.settings.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: {{t.settings.weight}}; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10"></path><path d="M18 7h2"></path><circle cx="16" cy="7" r="2"></circle><path d="M4 17h2"></path><path d="M10 17h10"></path><circle cx="8" cy="17" r="2"></circle></svg>
        Settings
      </a>
    </nav>
  </sc-if>

  <!-- M8: full screen chat and conversation list -->
  <sc-if value="{{onChat}}" hint-placeholder-val="{{ false }}">
    <dc-import name="M8Chat" layout="screen" state="{{chat}}" height="844px" on-nav="{{go}}" on-toast="{{showToast}}" accent="{{accent}}" theme="{{theme}}" on-modal="{{openModal}}" hint-size="390px,844px"></dc-import>
  </sc-if>
  <sc-if value="{{onHistory}}" hint-placeholder-val="{{ false }}">
    <dc-import name="M8History" layout="screen" height="844px" accent="{{accent}}" on-nav="{{go}}" on-toast="{{showToast}}" theme="{{theme}}" on-modal="{{openModal}}" hint-size="390px,844px"></dc-import>
  </sc-if>

  <!-- Share sheet -->
  <sc-if value="{{share}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" onClick="{{closeShare}}" style="position: absolute; inset: 0; background: rgba(5,6,9,0.6)"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0">
      <dc-import name="JournalShare" day="{{shareDay}}" variant="sheet" max-h="812px" on-nav="{{go}}" on-toast="{{showToast}}" accent="{{accent}}" theme="{{theme}}" on-modal="{{openModal}}" hint-size="390px,790px"></dc-import>
    </div>
  </sc-if>

  <!-- Modals: one at a time, above everything except toasts -->
  <sc-if value="{{hasModal}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" class="tm-fade" onClick="{{closeModal}}" style="position: absolute; inset: 0; z-index: 50; background: rgba(5,6,9,0.6); animation-duration: .2s"></div>
    <div class="tm-sheet" role="dialog" aria-modal="true" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 51">
      <dc-import name="Modal" modal="{{modal}}" layout="sheet" max-h="780px" theme="{{theme}}" accent="{{accent}}" on-close="{{closeModal}}" on-toast="{{showToast}}" on-nav="{{go}}" on-modal="{{openModal}}" hint-size="390px,600px"></dc-import>
    </div>
  </sc-if>

  <!-- Account deleted -->
  <sc-if value="{{deleted}}" hint-placeholder-val="{{ false }}">
    <div class="tm-fade" style="position: absolute; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; box-sizing: border-box; text-align: center; background: {{c.bg}}; color: {{c.text}}; font-family: Manrope, system-ui, sans-serif">
      <svg class="tm-pop" width="56" height="56" viewBox="0 0 36 36" aria-hidden="true"><rect x="0" y="0" width="36" height="36" rx="12" fill="{{accent}}"></rect><rect x="11" y="12" width="4.5" height="9" rx="2.25" fill="#15140E"></rect><rect x="20.5" y="12" width="4.5" height="9" rx="2.25" fill="#15140E"></rect></svg>
      <span style="font-size: 22px; font-weight: 800">Your account is deleted</span>
      <span style="max-width: 340px; font-size: 14px; line-height: 1.55; font-weight: 600; color: {{c.text2}}">Every trade, journal entry, rule and memory is gone, and M8 won't message you again. Good luck out there.</span>
      <button class="tm-press" onClick="{{restart}}" style="margin-top: 8px; height: 48px; padding: 0 22px; border: none; border-radius: 999px; background: {{accent}}; color: #15140E; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Restart the prototype</button>
    </div>
  </sc-if>

  <!-- Toasts: one at a time, inverted surface, Undo instead of confirm dialogs -->
  <div role="status" aria-live="polite" style="position: absolute; z-index: 60; pointer-events: none; display: flex; justify-content: center; left: 16px; right: 16px; top: {{tPos.top}}; bottom: {{tPos.bottom}}">
    <sc-if value="{{toast.show}}" hint-placeholder-val="{{ false }}">
      <div class="tm-toast" style="pointer-events: auto; max-width: 440px; display: flex; align-items: center; gap: 10px; min-height: 48px; box-sizing: border-box; padding: 8px {{toast.padR}} 8px 12px; border-radius: 18px; background: {{tc.bg}}; color: {{tc.fg}}; box-shadow: 0 16px 40px rgba(0,0,0,0.35); font-family: Manrope, system-ui, sans-serif; font-size: 14px; line-height: 1.35; font-weight: 700">
        <span style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 12px; background: {{toast.iconBg}}; color: {{toast.iconFg}}; display: flex; align-items: center; justify-content: center"><sc-if value="{{toast.success}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if><sc-if value="{{toast.info}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 11v6"></path><path d="M12 7h.01"></path></svg></sc-if><sc-if value="{{toast.error}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6"></path><path d="M12 17h.01"></path></svg></sc-if></span>
        <span style="flex-grow: 1; padding: 4px 0">{{toast.text}}</span>
        <sc-if value="{{toast.hasUndo}}" hint-placeholder-val="{{ false }}">
          <button class="tm-press" onClick="{{undoToast}}" style="height: 32px; flex-shrink: 0; padding: 0 14px; border: none; border-radius: 999px; background: {{tc.btn}}; color: {{tc.fg}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer">Undo</button>
        </sc-if>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Esc closes the top-most layer; M opens M8.
  onKey(e) {
    const st = this.state || {};
    const typing = e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.key === 'Escape') {
      if (st.modal) this.setState({ modal: null });
      else if (st.share) this.setState({ share: false });
      else if (st.m8) this.setState({ m8: st.m8 === 'history' ? 'chat' : null });
    } else if (!typing && (e.key === 'm' || e.key === 'M') && !e.metaKey && !e.ctrlKey && !st.modal && !st.deleted) { this.setState({ m8: 'chat', chat: 'active' }); }
  }
  componentDidMount() {
    this._onKey = (e) => this.onKey(e);
    window.addEventListener('keydown', this._onKey);
    this.setState({ seen: { journal: true }, phase: 'load', intro: true });
    this._lt = [setTimeout(() => this.setState({ phase: 'out' }), 700), setTimeout(() => this.setState({ phase: null }), 940)];
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._onKey); clearTimeout(this._mt); clearTimeout(this._tt); clearTimeout(this._tt2); (this._lt || []).forEach(clearTimeout); }
  renderVals() {
    const st = this.state || {};
    const accent = st.accent || '#7CD4FF';
    const theme = st.theme || 'dark';
    const voice = st.voice || 'friend';
    const themes = {
      dark: { bg: '#0D0E13', surface: '#171922', text: '#F3F4F7', text2: '#A9AEBE' },
      light: { bg: '#F4F4F7', surface: '#FFFFFF', text: '#12131A', text2: '#4F5566' }
    };
    const c = themes[theme];
    // Theme-aware helpers from design/tokens.json: accent ink for foreground use on light, warn and danger.
    const tkLight = (theme) === 'light';
    const tkn = {
      ink: tkLight ? ({ '#7CD4FF': '#0072AA', '#FFD23F': '#866700', '#6495ED': '#1B63E5', '#B4A5FF': '#6849FF', '#FF85C8': '#D10073', '#FF9152': '#BD4500', '#FFB547': '#9E5E00' }[String(accent).toUpperCase()] || accent) : accent,
      flash: accent + '38',
      warn: tkLight ? '#A86400' : '#FFE07A', warnSoft: tkLight ? 'rgba(168,100,0,0.10)' : 'rgba(255,224,122,0.14)',
      danger: tkLight ? '#D23434' : '#FF6B6B'
    };
    const setAccent = (a) => this.setState({ accent: a });
    const setTheme = (t) => this.setState({ theme: t });
    const setVoice = (v) => this.setState({ voice: v });
    const tab = st.tab || 'journal';
    const m8 = st.m8 || null;
    const chat = st.chat || 'active';
    // Toasts: show one at a time; re-mount so the entrance plays for each new one.
    const showToast = (t) => {
      clearTimeout(this._tt); clearTimeout(this._tt2);
      this.setState({ toast: null });
      this._tt2 = setTimeout(() => {
        this.setState({ toast: t });
        this._tt = setTimeout(() => this.setState({ toast: null }), t.undo ? 5000 : 3200);
      }, 40);
    };
    const undoToast = () => { const t = this.state && this.state.toast; if (!t) return; if (t.onUndo) t.onUndo(); showToast({ text: t.undo, kind: 'info' }); };
    const tcs = {
      dark: { bg: '#F3F4F7', fg: '#12131A', btn: 'rgba(18,19,26,0.08)', success: ['#0B8A51', '#FFFFFF'], info: ['#12131A', '#F3F4F7'], error: ['#D23434', '#FFFFFF'] },
      light: { bg: '#12131A', fg: '#F3F4F7', btn: 'rgba(255,255,255,0.12)', success: ['#3FD98E', '#0D0E13'], info: ['#F3F4F7', '#12131A'], error: ['#FF6B6B', '#0D0E13'] }
    };
    const tc = tcs[theme];
    const tt = st.toast || null;
    const kind = tt ? (tt.kind || 'info') : 'info';
    const toast = {
      show: !!tt, text: tt ? tt.text : '', hasUndo: !!(tt && tt.undo), padR: tt && tt.undo ? '8px' : '16px',
      success: kind === 'success', info: kind === 'info', error: kind === 'error', iconBg: tc[kind][0], iconFg: tc[kind][1]
    };
    // First visit to each page: skeleton for ~0.5s, then it fades out and the page animates in.
    const load = (to, extra) => {
      const seen = (this.state && this.state.seen) || {};
      (this._lt || []).forEach(clearTimeout);
      if (seen[to]) { this.setState(Object.assign({ phase: null, intro: false }, extra)); return; }
      this.setState(Object.assign({ phase: 'load', intro: true, seen: Object.assign({}, seen, { [to]: true }) }, extra));
      this._lt = [setTimeout(() => this.setState({ phase: 'out' }), 520), setTimeout(() => this.setState({ phase: null }), 760)];
    };
    const phase = st.phase === undefined ? 'load' : st.phase;
    const intro = st.intro === undefined ? true : st.intro;
    // Modals: re-mount on every open so each starts fresh.
    const openModal = (m) => {
      clearTimeout(this._mt);
      if (this.state && this.state.modal) { this.setState({ modal: null }); this._mt = setTimeout(() => this.setState({ modal: m }), 40); }
      else this.setState({ modal: m });
    };
    const closeModal = () => this.setState({ modal: null });
    const setDay = (d) => this.setState({ day: d });
    const openShare = (payload) => this.setState({ share: true, shareDay: payload || null, modal: null });
    const restart = () => { (this._lt || []).forEach(clearTimeout); this.setState({ deleted: false, modal: null, share: false, toast: null, day: null, seen: { journal: true }, phase: null, intro: false, tab: 'journal', m8: null }); };
    const day = st.day || '2026-10-07';
    const go = (to) => {
      if (st.modal && to !== 'close') this.setState({ modal: null });
      if (to.indexOf('day:') === 0) { load('journal', { tab: 'journal', m8: null, share: false, day: to.slice(4) }); return; }
      if (to === 'deleted') { this.setState({ deleted: true, modal: null, share: false, drawer: false, expanded: false, m8: null }); return; }
      if (to === 'journal' || to === 'stats' || to === 'settings') load(to, { tab: to, m8: null, share: false });
      else if (to === 'm8' || to === 'ask' || to === 'openActive') this.setState({ m8: 'chat', chat: 'active', share: false });
      else if (to === 'askFresh' || to === 'newTopic') this.setState({ m8: 'chat', chat: 'fresh', share: false });
      else if (to === 'history') this.setState({ m8: 'history' });
      else if (to === 'back') this.setState({ m8: m8 === 'history' ? 'chat' : null });
      else if (to === 'share') this.setState({ share: true });
      else if (to === 'close') this.setState({ share: false });
    };
    const tabItem = (k) => {
      const on = (k === 'm8') ? m8 !== null : (m8 === null && tab === k);
      return {
        current: on ? 'page' : 'false', bg: on ? accent : 'transparent', fg: on ? '#15140E' : c.text2, weight: on ? 800 : 700,
        go: (e) => { if (e && e.preventDefault) e.preventDefault(); go(k); }
      };
    };
    return { tkn,
      tab, showToast, undoToast, tc, toast, openModal, closeModal, setDay, day, restart, openShare, shareDay: st.shareDay || null,
      modal: st.modal || null, hasModal: !!st.modal, deleted: !!st.deleted,
      skel: phase !== null, skelAnim: phase === 'out' ? 'tm-out .24s ease both' : 'none', introD: intro ? '.55s' : '0s', introMs: intro ? 550 : 0,
      tPos: (st.share || st.modal) ? { top: '16px', bottom: 'auto' } : { top: 'auto', bottom: m8 === 'chat' ? '150px' : (m8 === 'history' ? '24px' : '104px') },
      c, accent, theme, voice, go, setAccent, setTheme, setVoice, chat,
      t: { journal: tabItem('journal'), stats: tabItem('stats'), m8: tabItem('m8'), settings: tabItem('settings') },
      onJournal: m8 === null && tab === 'journal', onStats: m8 === null && tab === 'stats', onSettings: m8 === null && tab === 'settings',
      showTabs: m8 === null, onChat: m8 === 'chat', onHistory: m8 === 'history',
      share: !!st.share, closeShare: () => this.setState({ share: false })
    };
  }
}
