<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrenchM8 - M8 drawer (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 1480px; overflow: hidden; background: #0D0E13">
  <dc-import name="Desktop" accent="{{accent}}" hint-size="1440px,1480px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5,6,9,0.55)"></div>
  <aside aria-label="M8 chat" style="position: absolute; top: 0; right: 0; bottom: 0; width: 440px; border-left: 1px solid #2C303D; box-shadow: -24px 0 48px rgba(0,0,0,0.35); display: flex">
    <dc-import name="M8Chat" layout="drawer" accent="{{accent}}" hint-size="440px,1480px"></dc-import>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CD4FF","options":["#7CD4FF","#FFD23F","#6495ED","#B4A5FF","#FF85C8","#FF9152","#FFB547"],"section":"Look"},"$preview":{"width":1440,"height":1480}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#7CD4FF' };
  }
}
</script>
</body>
</html>
