<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrenchM8 - Share a journal day as text</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1000px; display: flex; background: #0D0E13">
  <dc-import name="JournalShare" mode="text" money="pct" accent="{{accent}}" hint-size="390px,1000px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CD4FF","options":["#7CD4FF","#FFD23F","#6495ED","#B4A5FF","#FF85C8","#FF9152","#FFB547"],"section":"Look"},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#7CD4FF' };
  }
}
</script>
</body>
</html>
